name: invoiceapp
description: "A new Flutter project InvoiceProApp."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  path_provider: ^2.1.5
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # UI Components
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0

  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/